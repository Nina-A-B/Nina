<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nina Bentmosse — IT-infrastruktur &amp; LIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* MÖRKT TEMA (standard) */
:root{
  --bg:#05091A;
  --bg2:#080D21;
  --bg3:#0C1230;
  --bg4:#0F1535;
  --blue:#2563EB;
  --blue2:#3B82F6;
  --blue3:#60A5FA;
  --blue-pale:rgba(37,99,235,0.12);
  --blue-glow:rgba(37,99,235,0.22);
  --white:#FFFFFF;
  --off-white:#E2E8F0;
  --on-blue:#FFFFFF;
  --grey:#94A3B8;
  --grey2:#64748B;
  --border:rgba(255,255,255,0.07);
  --border2:rgba(37,99,235,0.2);
  --grid:rgba(255,255,255,0.025);
  --stroke:rgba(255,255,255,0.25);
  --nav-bg:rgba(5,9,26,0.9);
  --ticker-bg:rgba(8,13,33,0.6);
  --mono:'JetBrains Mono',monospace;
  --display:'Syne',sans-serif;
  --body:'Inter',sans-serif;
}

/* LJUST TEMA */
[data-theme="light"]{
  --bg:#F7F8FC;
  --bg2:#FFFFFF;
  --bg3:#EEF2FB;
  --bg4:#E6ECF8;
  --blue:#2563EB;
  --blue2:#3B82F6;
  --blue3:#1D4ED8;
  --blue-pale:rgba(37,99,235,0.08);
  --blue-glow:rgba(37,99,235,0.15);
  --white:#0F172A;
  --off-white:#1E293B;
  --on-blue:#FFFFFF;
  --grey:#475569;
  --grey2:#64748B;
  --border:rgba(15,23,42,0.1);
  --border2:rgba(37,99,235,0.3);
  --grid:rgba(15,23,42,0.04);
  --stroke:rgba(15,23,42,0.35);
  --nav-bg:rgba(247,248,252,0.92);
  --ticker-bg:rgba(255,255,255,0.7);
}

html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:var(--body);background:var(--bg);color:var(--white);line-height:1.6;min-height:100%;overflow-x:hidden;transition:background 0.3s,color 0.3s}

/* LANGUAGE */
[data-sv],[data-en]{display:none}
body.sv [data-sv]{display:revert}
body.en [data-en]{display:revert}
span[data-sv],span[data-en]{display:none}
body.sv span[data-sv]{display:inline}
body.en span[data-en]{display:inline}
body.sv span[data-en]{display:none}
body.en span[data-sv]{display:none}

/* FOCUS VISIBILITY */
a:focus-visible,button:focus-visible{
  outline:2px solid var(--blue3);
  outline-offset:3px;
  border-radius:4px;
}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:500;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(1.5rem,5vw,4rem);transition:background 0.3s,border-color 0.3s;border-bottom:1px solid transparent}
nav.scrolled{background:var(--nav-bg);backdrop-filter:blur(20px);border-color:var(--border)}
.nav-logo{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-0.03em;color:var(--white)}
.nav-logo span{color:var(--blue2)}
.nav-right{display:flex;align-items:center;gap:1.2rem}
.theme-toggle{width:34px;height:34px;border-radius:6px;border:1px solid var(--border);background:var(--blue-pale);color:var(--white);cursor:pointer;font-size:.95rem;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.theme-toggle:hover{border-color:var(--blue2)}
.lang-toggle{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--blue-pale)}
.lang-btn{padding:.3rem .65rem;font-size:.72rem;font-weight:600;cursor:pointer;border:none;background:none;color:var(--grey);font-family:var(--mono);transition:all 0.2s}
.lang-btn.active{background:var(--blue);color:var(--on-blue)}
.nav-cta{font-size:.8rem;font-weight:600;color:var(--white);text-decoration:none;border:1px solid var(--border2);padding:.45rem 1.1rem;border-radius:6px;transition:all 0.2s;background:var(--blue-pale)}
.nav-cta:hover{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}

/* HERO */
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:0 clamp(1.5rem,5vw,4rem) 6rem;position:relative;overflow:hidden}
.hero-bg{position:absolute;inset:0;pointer-events:none}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:80px 80px}
.hero-glow-1{position:absolute;top:-20%;right:-10%;width:70vw;height:70vw;max-width:900px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,0.15) 0%,transparent 65%)}
.hero-glow-2{position:absolute;bottom:-30%;left:-10%;width:50vw;height:50vw;max-width:700px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,0.08) 0%,transparent 65%)}
.hero-noise{position:absolute;inset:0;opacity:0.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4'/%3E%3C/filter%3E%3Crect width='512' height='512' filter='url(%23n)'/%3E%3C/svg%3E")}

.hero-inner{position:relative;z-index:1;max-width:1100px}
.hero-h1{font-family:var(--display);font-size:clamp(3rem,9vw,7rem);font-weight:800;line-height:1;letter-spacing:-0.04em;margin-bottom:2rem}
.hero-h1 .line{display:block;overflow:hidden}
.hero-h1 .line span{display:block;animation:slideUp 0.9s cubic-bezier(0.16,1,0.3,1) both}
.hero-h1 .line:nth-child(2) span{animation-delay:0.12s}
.hero-h1 .line:nth-child(3) span{animation-delay:0.24s}
.hero-h1 .accent{color:transparent;-webkit-text-stroke:1px var(--stroke)}
.hero-h1 .blue{color:var(--blue3)}
@keyframes slideUp{from{transform:translateY(105%);opacity:0}to{transform:translateY(0);opacity:1}}

.hero-bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:2rem;flex-wrap:wrap}
.hero-sub{max-width:440px;color:var(--grey);font-size:.95rem;line-height:1.85;animation:fadeIn 1s 0.5s both}
.hero-sub strong{color:var(--off-white)}
.hero-cta-row{display:flex;align-items:center;gap:1rem;animation:fadeIn 1s 0.7s both}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.btn-primary{display:inline-flex;align-items:center;gap:.5rem;background:var(--blue);color:var(--on-blue);padding:.8rem 1.8rem;border-radius:8px;font-weight:600;font-size:.88rem;text-decoration:none;transition:all 0.2s}
.btn-primary:hover{background:var(--blue2);box-shadow:0 0 40px rgba(37,99,235,0.4)}
.scroll-hint{font-family:var(--mono);font-size:.68rem;color:var(--grey2);animation:fadeIn 1.2s 1s both;writing-mode:vertical-rl;position:absolute;right:clamp(1.5rem,5vw,4rem);bottom:6rem;letter-spacing:.1em}

/* TICKER */
.ticker{padding:.8rem 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);overflow:hidden;background:var(--ticker-bg)}
.ticker-track{display:flex;width:max-content;gap:0;animation:scroll 30s linear infinite}
.ticker-item{display:flex;align-items:center;padding:0 2.5rem;font-size:.7rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--grey2);white-space:nowrap;border-radius:6px;transition:color 0.2s,background 0.2s}
.ticker-item:hover{color:var(--white);background:rgba(37,99,235,0.15);box-shadow:0 0 20px rgba(37,99,235,0.2)}
.ticker-dot{width:4px;height:4px;border-radius:50%;background:var(--blue2);margin-right:2.5rem}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.ticker-track,.hero-h1 .line span{animation:none}.hero-h1 .line span{opacity:1;transform:none}}

/* SECTIONS */
.s{padding:clamp(5rem,10vw,9rem) clamp(1.5rem,5vw,4rem);border-bottom:1px solid var(--border);max-width:100%}
.s-inner{max-width:1100px;margin:0 auto}
.s-tag{font-family:var(--mono);font-size:.7rem;color:var(--blue3);letter-spacing:.15em;text-transform:uppercase;margin-bottom:1.2rem;display:flex;align-items:center;gap:.7rem}
.s-title{font-family:var(--display);font-size:clamp(1.8rem,4vw,3rem);font-weight:800;letter-spacing:-0.04em;line-height:1.1;margin-bottom:1.2rem}
.s-sub{color:var(--grey);font-size:.92rem;line-height:1.85;max-width:540px;margin-bottom:3.5rem}

/* WHAT I OFFER — numbered grid */
.features{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1px;border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--border)}
.feat{background:var(--bg2);padding:2.2rem 2rem;position:relative;transition:background 0.25s,box-shadow 0.3s}
.feat::before{content:'';position:absolute;inset:0;padding:1px;background:conic-gradient(from 0deg,#ff4500,#ff8c00,#ffd700,#32cd32,#00ced1,#4169e1,#9400d3,#ff4500);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude;opacity:0;transition:opacity 0.35s;pointer-events:none;z-index:0}
.feat:hover{background:var(--bg3);box-shadow:0 0 40px rgba(80,120,255,0.12)}
.feat:hover::before{opacity:1}
.feat-num{font-family:var(--mono);font-size:.7rem;color:var(--blue3);margin-bottom:1.2rem;display:block}
